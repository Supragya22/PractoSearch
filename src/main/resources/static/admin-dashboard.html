<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Practo</title>
    <link rel="stylesheet" href="styles/admin-dashboard.css">
</head>
<body>
    <header class="practo-header">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/en/6/64/Practo_new_logo.png" alt="Practo Logo">
        </div>
        <h1>Admin Dashboard</h1>
    </header>
    <div class="dashboard-container">
        <h2>Admin Dashboard</h2>
        <div class="options-container">
            <div class="option card">
                <i class="fas fa-user-md"></i>
                <h3>Add Doctor</h3>
                <p>Register a new doctor to the platform.</p>
                <button onclick="redirectToDoctorForm()">Add Doctor</button>
            </div>
            <div class="option card">
                <i class="fas fa-hospital"></i>
                <h3>Add Practice</h3>
                <p>Add a new clinic or hospital for doctor associations.</p>
                <button onclick="redirectToPracticeForm()">Add Practice</button>
            </div>
        </div>
    </div>

<footer class="footer">
    <p>&copy; 2025 Practo. All rights reserved.</p>
</footer>

<script src="scripts/admin-dashboard.js"></script>
</body>
</html>
