<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Form</title>
    <link rel="stylesheet" href="styles/doctor-form.css">
</head>
<body>
<!-- Header -->
<header>
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/en/6/64/Practo_new_logo.png" alt="Practo Logo">
    </div>
</header>
<div class="form-container">
    <h1>Doctor</h1>
    <form id="doctorForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required>

        <label for="experience">Experience (Years):</label>
        <input type="number" id="experience" required>

        <label for="qualifications">Qualifications:</label>
        <input type="text" id="qualifications" required>

        <!-- Specialities Section -->
        <label>Specialities:</label>
        <div id="specialityContainer">
            <!-- Checkboxes will be added dynamically here -->
        </div>

        <!-- Practices Section -->
        <label>Practices:</label>
        <div id="practiceContainer">
            <!-- Checkboxes will be added dynamically here -->
        </div>

        <button type="submit">Save Doctor</button>
    </form>

    <div id="responseMessage"></div>
</div>
<!-- Footer -->
<footer>
    <div class="footer-container">
        <p>&copy; 2025 Practo. All rights reserved.</p>
    </div>
</footer>
<script src="scripts/doctor-form.js"></script>
</body>
</html>
