<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Search</title>
    <link rel="stylesheet" href="styles/index.css">
  </head>
  <body>

  <div class="container">
    <h2>Universal Search</h2>
    <input type="text" id="searchInput" placeholder="Search doctors, specialities, or practices...">

    <div id="loading" class="loading-spinner" style="display: none;"></div> <!-- Loading Spinner -->
    <div id="resultsContainer"></div> <!-- Search Results -->
  </div>
  <script src="scripts/index.js"></script>

  </body>
</html>
