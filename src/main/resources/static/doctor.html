<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Details</title>
  <link rel="stylesheet" href="styles/doctor.css">
</head>
<body>

<header>
  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/en/6/64/Practo_new_logo.png" alt="Logo">
  </div>
</header>

<h2 class="page-title">Doctor Details</h2>

<div class="container">
  <div class="doctor-info">
    <img src="https://cdn.pixabay.com/photo/2018/11/13/22/01/avatar-3814081_1280.png" alt="Doctor Image" class="doctor-img">
    <div class="doctor-details">
      <p><strong>Name:</strong> <span id="doctorName"></span></p>
      <p><strong>Experience:</strong> <span id="doctorExperience"></span> years</p>
      <p><strong>Qualifications:</strong> <span id="doctorQualifications"></span></p>
      <p><strong>Specialities:</strong> <span id="doctorSpecialities"></span></p>
      <p><strong><span id="doctorPractices"></span></strong></p>
    </div>
  </div>
</div>

<div class="back-button-container">
  <button id="backToSearch">Back to Search</button>
</div>

<footer>
  <div class="footer-container">
    <p>&copy; 2025 Practo Clone. All rights reserved.</p>
  </div>
</footer>

<script src="scripts/doctor.js"></script>
</body>
</html>
