<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Form</title>
    <link rel="stylesheet" href="styles/practice-form.css">
</head>
<body>
<div class="form-container">
    <h1>Hospital/Clinics</h1>
    <form id="practiceForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required>

        <label for="address">Address:</label>
        <input type="text" id="address" required>

        <label for="state">State:</label>
        <input type="text" id="state" required>

        <label for="city">City:</label>
        <input type="text" id="city" required>

        <label for="website">Website:</label>
        <input type="text" id="website" required>

        <!-- Specialities Checkboxes -->
        <label>Specialities:</label>
        <div id="specialityContainer" class="checkbox-container"></div>

        <!-- Doctors Checkboxes -->
        <label>Doctors:</label>
        <div id="doctorContainer" class="checkbox-container"></div>

        <button type="submit">Save Practice</button>
    </form>

    <div id="responseMessage"></div>
</div>

<script src="scripts/practice-form.js"></script>
</body>
</html>
